# Тег vX.Y.Z -> сборка TarBitTorrent.exe на Windows и релиз на GitHub с этим файлом.
# Программа сама найдет релиз и предложит обновиться.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Версия в коде совпадает с тегом
        shell: pwsh
        run: |
          $v = python -c "from tarbit.version import VERSION; print(VERSION)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tarbit/version.py = $v, тег = ${{ github.ref_name }}" }

      - name: Зависимости
        run: python -m pip install -r requirements.txt

      - name: Тесты
        run: python -m unittest discover -s tests -v

      - name: Сборка
        run: |
          python tools/version_info.py
          pyinstaller --noconfirm --clean --log-level WARN TarBitTorrent.spec

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TarBitTorrent.exe
          generate_release_notes: true
